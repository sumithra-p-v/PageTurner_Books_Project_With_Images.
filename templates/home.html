{% extends 'base.html' %}

{% block content %}
<div class="container my-5">

    <!-- Search and Filter Bar -->
    <div class="card border-0 shadow-sm p-4 mb-5 bg-white rounded-3">
        <h4 class="fw-bold mb-3">Find Your Book</h4>
        <form action="{{ url_for('home') }}" method="GET" class="row g-3">
            <div class="col-md-6">
                <input type="text" name="search" class="form-control" placeholder="Search by title, author or category..." value="{{ request.args.get('search', '') }}">
            </div>
            <div class="col-md-4">
                <select name="category" class="form-select">
                    <option value="">All Categories</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if request.args.get('category') == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold">Search</button>
            </div>
        </form>
    </div>

    <!-- Books Horizontal Grid Row -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        {% for book in books %}
        <div class="col">
            <div class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden bg-white">
                <!-- Book Image Container -->
                <div class="bg-light text-center p-3 d-flex align-items-center justify-content-center" style="height: 240px;">
                    <img src="{{ book.image_url }}" alt="{{ book.title }}" class="img-fluid mh-100" style="object-fit: contain; max-height: 200px;">
                </div>

                <!-- Book Details -->
                <div class="card-body d-flex flex-column p-3">
                    <span class="text-uppercase text-muted fw-bold mb-1" style="font-size: 0.75rem;">{{ book.category }}</span>
                    <h6 class="card-title fw-bold text-truncate mb-1" title="{{ book.title }}">{{ book.title }}</h6>
                    <p class="text-muted small mb-3">by {{ book.author }}</p>

                    <div class="mt-auto d-flex align-items-center justify-content-between pt-2 border-top">
                        <span class="fw-bold fs-6 text-primary">₹{{ "%.2f"|format(book.price) }}</span>
                        <a href="{{ url_for('book_detail', book_id=book.id) }}" class="btn btn-outline-dark btn-sm fw-bold">View Book &rarr;</a>
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center py-5">
            <h5>No books found matching your criteria.</h5>
            <a href="{{ url_for('home') }}" class="btn btn-secondary btn-sm mt-2">Clear Search</a>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
