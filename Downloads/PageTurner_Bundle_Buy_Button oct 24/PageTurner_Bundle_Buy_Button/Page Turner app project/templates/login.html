{% extends "base.html" %}
{% block content %}
<div class="container my-5" style="max-width: 400px;">
    <h2>Customer Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
    <p class="small text-muted mt-3">Five failed passwords temporarily lock login for 15 minutes. If an administrator locks your account, contact them to unlock it.</p>
    <p class="mt-2"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
    <p class="mt-3">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
</div>
{% endblock %}
